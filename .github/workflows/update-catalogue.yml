name: Update Catalogue

on:
  # Run manually from GitHub Actions tab
  workflow_dispatch:
  # Or on a schedule — weekly Sunday midnight IST
  schedule:
    - cron: '30 18 * * 0' # 18:30 UTC = midnight IST

jobs:
  update:
    name: Export catalogue from Neon DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export catalogue
        run: pnpm --filter scripts export-catalogue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit updated catalogue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update catalogue.json'
          file_pattern: 'apps/web/public/catalogue.json'
